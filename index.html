<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="confetti-canvas" aria-hidden="true"></canvas>

    <main class="card">
      <p class="tag">🎂 Birthday Wishes 🎉</p>
      <h1>Happy Birthday!</h1>
      <p class="message">
        Wishing you laughter that fills the room, moments that become memories,
        and a year packed with joy, adventure, and everything you love.
      </p>
      <button id="celebrate-btn" type="button">Celebrate 🎈</button>
      <p id="surprise" class="surprise" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
